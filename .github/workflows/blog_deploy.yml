name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 升级到最新版，修复 Node20 警告

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0  # 升级到最新版
        with:
          ssh-private-key: ${{ secrets.BLOG_SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan ${{ secrets.BLOG_SERVER_IP }} > ~/.ssh/known_hosts

      - name: Deploy to server
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.BLOG_USER }}@${{ secrets.BLOG_SERVER_IP }} 'bash -s' < ./deploy.sh